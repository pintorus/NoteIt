name: noteit
description: Gestionnaire de notes richtext avec dossiers (clone de Mi Notes).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_quill: ^11.6.0
  drift: ^2.35.2
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  uuid: ^4.6.0
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
